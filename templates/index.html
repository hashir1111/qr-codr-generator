<!DOCTYPE html>
<html>
<head>
    <title>QR Code Generator</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 450px;
            margin: 100px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0px 3px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background: #0078d4;
            color: white;
            border: none;
            padding: 13px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #106ebe;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>QR Code Generator</h2>

    <form method="POST">

        <label>Enter URL</label>

        <input
            type="url"
            name="link"
            placeholder="https://example.com"
            required
        >

        <label>QR Code File Name</label>

        <input
            type="text"
            name="filename"
            placeholder="Annual_Report_QR"
            required
        >

        <button type="submit">
            Generate QR Code
        </button>

    </form>

</div>

</body>
</html>
